[package]
name = "hifi-verify"
version = "5.0.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
hound = "3.5.1"
gio = "0.22.10"
glib = "0.22.10"
cairo-rs = "0.22.9"
gtk = { version = "0.11", package = "gtk4" }
gdk = { version = "0.11", package = "gdk4" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "perf/local-optimisations" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libpipewire-0.3-dev libasound2-dev pkg-config
        
    - name: Check, test, and build
      run: |
        cargo fmt --all -- --check
        cargo test --locked --verbose
        cargo build --locked --verbose
